[workspace]
resolver = "2"
exclude = ["third_party/ipa", "third_party/merlin"]
members = [
    "crates/e2e-benchmark", "crates/authentication",
    "crates/gem-core",
    "crates/gem-qemd-lemon",
    "crates/gem-search",
    "crates/gem-cli",
    "crates/gem-auth-v3",
    "crates/gem-matrix-proof",
    "crates/gem-auth-scheme-v3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
curve25519-dalek = { version = "4.1.1", features = ["digest", "group", "rand_core", "serde"] }
merlin = "3"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
half = { version = "2.6", features = ["serde"] }
hex = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
merlin = { path = "third_party/merlin" }
