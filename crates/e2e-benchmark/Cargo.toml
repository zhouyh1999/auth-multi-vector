[package]
name = "gem-lotte-auth-pilot"
version = "0.1.0"
edition = "2024"
[dependencies]
merlin = "3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
gem-core = { path = "../gem-core" }
gem-search = { path = "../gem-search" }
gem-auth-v3 = { path = "../gem-auth-v3" }
gem-matrix-proof = { path = "../gem-matrix-proof" }
half = { version = "2.6", features = ["serde"] }
curve25519-dalek = { version = "4.1.1", features = ["digest", "group", "rand_core", "serde"] }
bulletproofs = { package = "ipa", path = "../../third_party/ipa" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
bincode = "1.3"
hex = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
gem-cli = { path = "../gem-cli" }

gem-auth-scheme-original = { package = "gem-auth-scheme-v3", path = "../gem-auth-scheme-v3" }

gem-auth-scheme-multi = { package = "gem-auth-scheme-block-multi-bench", path = "../authentication" }

[[bin]]
name="first-visit"
path="serve_main.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "gem-prepare"
path = "prepare.rs"

[[bin]]
name = "population-owner"
path = "owner_main.rs"

[[bin]]
name = "bundle-owner"
path = "bundle_owner.rs"

[[bin]]
name = "gem-reference"
path = "reference.rs"

[[bin]]
name="check-historical"
path="historical.rs"
