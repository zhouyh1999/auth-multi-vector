[package]
name = "gem-auth-scheme-block-multi-bench"
version = "0.1.0"
edition = "2024"
[dependencies]
gem-auth-scheme-v3 = { path = "../gem-auth-scheme-v3" }
openssl = "=0.10.75"
merlin = "3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
gem-core = { path = "../gem-core" }
gem-search = { path = "../gem-search" }
gem-auth-v3 = { path = "../gem-auth-v3" }
gem-matrix-proof = { path = "../gem-matrix-proof" }
half = { version = "2.6", features = ["serde"] }
curve25519-dalek = { version = "4.1.1", features = ["digest", "group", "rand_core", "serde"] }
bulletproofs = { package = "ipa", path = "../../third_party/ipa" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
bincode = "1.3"
hex = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
gem-cli = { path = "../gem-cli" }

